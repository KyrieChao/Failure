name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and Test
        run: |
          mvn clean test -B --no-transfer-progress
          # 显式生成报告
          mvn jacoco:report -B --no-transfer-progress

      - name: Verify files exist
        run: |
          echo "Checking for coverage files..."
          find . -name "jacoco*.xml" -type f 2>/dev/null || echo "No jacoco XML found"
          ls -la target/site/jacoco/ 2>/dev/null || echo "Directory not found"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: KyrieChao/Failure
          files: ./target/site/jacoco/jacoco.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false