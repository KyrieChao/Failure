fail-fast:
  shadow-trace: true
  trim-stack-trace: true
  verbose: true
  debug-snapshot: true
  method-validation-enabled: true
  code-mapping:
    http-status:
      40010: 400
    groups:
      auth: [ "40100..40199" ]
      business: [ "40000..40099" ]
    constraint-mapping:
      NotBlank: 40010
      Email: 40020
      Positive: 40030
    constraint-path-mapping:
      - constraint: NotBlank
        path: user.username
        code: 40040
      - constraint: NotNull
        path: user.username
        code: 40040
      - constraint: Email
        path: user.email
        code: 40050
    constraint-bean-mapping:
      - constraint: NotBlank
        bean: com.chao.failuretest.model.dto.UserJSRDTO
        code: 40060
      - constraint: Email
        bean: com.chao.failuretest.model.dto.UserDTO
        code: 40070
  trace-id:
    enabled: true
    header-name: X-Trace-Id
    response-header-name: X-Trace-Id
    response-header: true
    generate-if-missing: true
    mdc-key: traceId
    mdc-enabled: true
  i18n:
    enabled: true
    default-locale: zh_CN
    base-name: classpath:i18n/messages
    encoding: UTF-8
    cache-seconds: 3600
  logging:
    default-severity: ERROR
    banner: false
    severity-mapping:
      40010: WARN
      40020: INFO
  masking:
    structured-enabled: true
    max-depth: 4
    max-collection-size: 20
    max-fields: 30
  chain:
    max-errors: 50
